# ---------- JPA performance for high insert ----------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# PostgreSQL driver optimization

# Hikari pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate logs off
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off


# --- Hibernate batching ---
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=2000
spring.jpa.properties.hibernate.generate_statistics=false

# --- Postgres driver batching ---
#spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# --- Hikari ---
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.auto-commit=false

# --- Your queue writer ---


# enable/disable the daily cache clear
cache.clear.enabled=true

# run every day at 00:00:00 IST
cache.clear.cron=0 0 0 * * *
cache.clear.zone=Asia/Kolkata

kafka.commanddata.write.max-retries=5
kafka.commanddata.write.retry-every-seconds=10
feature.if-not-exists=true
feature.if-not-exists-bill=true

feature.queue-writer.enabled=true

feature.queue.concurrency=4
feature.queue.batch-size=1000
feature.queue.flush-ms=2000



# Consume more per poll
spring.kafka.listener.type=batch
spring.kafka.consumer.max-poll-records=1000
spring.kafka.consumer.fetch-min-bytes=1048576
spring.kafka.consumer.fetch-max-wait-ms=200
spring.kafka.consumer.receive-buffer-bytes=262144
spring.kafka.consumer.max-partition-fetch-bytes=1048576



max.poll.records=500

fetch.max.bytes=52428800         
max.partition.fetch.bytes=52428800

max.poll.interval.ms=300000
fetch.min.bytes=1
fetch.max.wait.ms=50



# kafka groupId
kafka.billing.group-id=billing-groups-AA
kafka.instant.group-id=instantaneous-groups-B1
kafka.dailyLp.group-id=daily-ggroups-B1
kafka.dlp.group-id=delta-groups-M
kafka.voltageevent.group-id=voltage-groups-A5
kafka.transactionevent.group-id=Transaction-groups-A1
kafka.powerevent.group-id=power-groups-A
kafka.otherevent.group-id=Other-groups-A
kafka.currentevent.group-id=current-groups-A
kafka.controlevent.group-id=Control-groups-B1
kafka.alarm.group-id=Alarm-Data1
kafka.nameplate.group-id=Nameplate2
kafka.instantpush.group-id=InstantPush
kafka.deviceippinglogstatus.group-id=device-ping121

# Root logging level
logging.level.root=INFO
logging.level.console=INFO

logging.level.org.springframework=INFO
logging.level.com.ui.service=DEBUG

spring.jpa.properties.hibernate.default_schema=public

# Enable log file
logging.file.name=logs/app.log