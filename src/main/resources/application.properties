spring.application.name=Spring_PostgresSql

server.port=9090

#spring.datasource.url=jdbc:postgresql://10.48.136.132:5432/testdb


spring.datasource.url=jdbc:postgresql://10.48.136.145:5432/new_mdm_db?reWriteBatchedInserts=true
spring.datasource.username=admin
spring.datasource.password=Admin@123
#spring.datasource.username=postgres
#spring.datasource.password=chandan123
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Kafka Configuration
spring.kafka.bootstrap-servers=10.48.136.176:9094
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE


management.endpoints.web.exposure.include=*

# Enable detailed health info
management.endpoint.health.show-details=always

# Enable metrics for Prometheus (optional)
management.metrics.export.prometheus.enabled=true

# Enable HTTP tracing (optional)
management.trace.http.enabled=true

# retry mechanism
resilience4j.retry.instances.externalApiRetry.maxAttempts=3
resilience4j.retry.instances.externalApiRetry.waitDuration=30000
resilience4j.retry.instances.externalApiRetry.retryExceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
logging.level.io.github.resilience4j.retry=DEBUG

# Executor for AsyncOnDemandCommandService
threadpool.ondemand.core-size=5
threadpool.ondemand.max-size=10
threadpool.ondemand.queue-capacity=100
threadpool.ondemand.keep-alive-time=60

# Executor for SomeOtherService
threadpool.someother.core-size=2
threadpool.someother.max-size=4
threadpool.someother.queue-capacity=20
threadpool.someother.keep-alive-time=20

# scheduling
scheduler.cron.expression=0 0 * * * ?





datastax-java-driver.advanced.connection.pool.local.size=8o
datastax-java-driver.advanced.throttler.concurrency=512




kafka.enabled=true

management.endpoint.metrics.enabled=true
management.endpoint.health.enabled=true

spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true



spring.kafka.consumer.properties.request.timeout.ms=60000
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.heartbeat.interval.ms=15000
spring.kafka.consumer.properties.max.poll.interval.ms=300000

